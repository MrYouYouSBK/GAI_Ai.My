name: Security Runtime Refresh

on:
  push:
    branches:
      - project-s/foundation-rev01
    paths:
      - security-runtime-refresh.request

permissions:
  contents: write

concurrency:
  group: gai-security-runtime-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: project-s/foundation-rev01

      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Resolve non-breaking runtime security updates
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save             '@larksuiteoapi/node-sdk@>1.71.0 <2'             'electron-updater@>6.8.8 <7'             'undici@>6.27.0 <7'             'ws@>8.20.1 <9'

          node <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const names = [
            '@larksuiteoapi/node-sdk',
            'electron-updater',
            'undici',
            'ws',
          ]
          for (const name of names) {
            const version = lock.packages?.[`node_modules/${name}`]?.version
            if (!version) throw new Error(`Resolved version missing for ${name}`)
            pkg.dependencies[name] = `^${version}`
            console.log(`[security-refresh] ${name} -> ^${version}`)
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE

          npm install --package-lock-only --ignore-scripts

      - name: Install refreshed dependency tree
        run: npm ci --ignore-scripts

      - name: Run security-sensitive regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm run test:offline
          npm run test:config-upgrade
          npm run test:voice-continuous
          npm run test:local-ai
          npm run test:community-updater
          npm run test:websocket-security
          npm run test:project-s-trust

      - name: Recalculate audit baseline
        shell: bash
        run: |
          npm audit --json > npm-audit-after-refresh.json || true
          npm run audit:security:report -- npm-audit-after-refresh.json security-audit-after-refresh.md
          cat security-audit-after-refresh.md

      - name: Commit verified runtime dependency refresh
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: refresh non-breaking runtime dependencies"
          git push origin HEAD:project-s/foundation-rev01

      - name: Upload post-refresh audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GAI-AI-security-runtime-refresh
          path: |
            npm-audit-after-refresh.json
            security-audit-after-refresh.md
          if-no-files-found: warn
