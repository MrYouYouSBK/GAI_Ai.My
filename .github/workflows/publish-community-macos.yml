name: Community macOS installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/publish-community-macos.yml'
      - 'scripts/**'
      - 'electron/**'
      - 'src/**'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-community-macos.yml'
      - 'scripts/**'
      - 'electron/**'
      - 'src/**'
      - 'package*.json'

permissions:
  contents: read

jobs:
  mac:
    name: Community ${{ matrix.arch }} install and launch
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GAI_COMMUNITY_DISTRIBUTION: 'true'
      GAI_REQUIRE_MAC_SIGNING: 'false'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Ad-hoc signing has no secret material and must also run for PR artifacts.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run check:release-safety
      - run: npm ci
      - name: Verify offline, voice, reminders, local AI and updater
        run: |
          npm run test:offline
          npm run test:config-upgrade
          npm run test:voice-continuous
          npm run test:gai-v31
          npm run test:gai-v32
          npm run test:startup-task-briefing
          npm run test:local-ai
          npm run test:community-updater
          npm run test:mac-signing-key-bundle
          npm run test:websocket-security
      - run: npm run build:mac:${{ matrix.arch }}
      - run: npm run verify:mac -- ${{ matrix.arch }}
      - run: node scripts/package-community-macos.mjs ${{ matrix.arch }}
      - name: Test actual community installation, relaunch and update validation
        run: node scripts/test-community-macos.mjs ${{ matrix.arch }}
      - name: Upload tested installers
        uses: actions/upload-artifact@v4
        with:
          name: community-macos-${{ matrix.arch }}
          path: |
            dist/*-Community-Installer-${{ matrix.arch }}.zip
            dist/GAI-AI-*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: community-macos-*
          path: release-assets
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish community release after installation tests pass
        run: |
          version=$(node -p "require('./package.json').version")
          tag="community-v${version}"
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "GAI AI ${version} — Mac Community Installer" --notes-file RELEASE_NOTES_COMMUNITY.md --latest=false
